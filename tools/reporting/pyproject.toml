[project]
name = "elice-reporting"
version = "1.0.0"
description = "Notebook-based reporting for Elice RAG evaluations"
requires-python = ">=3.12,<3.13"
dependencies = [
  "bokeh>=3.8,<4",
  "hvplot>=0.12,<0.13",
  "holoviews>=1.22,<2",
  "jinja2>=3.1,<4",
  "markupsafe>=3,<4",
  "mlflow-skinny>=3.18,<4",
  "pandas>=2.2,<4",
  "panel>=1.8,<2",
  "markdown-it-py>=3,<5",
]

[dependency-groups]
dev = [
  "ipykernel>=6,<8",
  "jupyter-bokeh>=4,<5",
  "jupyterlab>=4.4,<5",
  "nbclient>=0.10,<1",
  "nbformat>=5.10,<6",
  "pytest>=8,<10",
  "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/elice_reporting"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
