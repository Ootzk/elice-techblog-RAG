name: elice-techblog-rag

# Production base for Elice Cloud; dev adds compose.dev.yaml.
services:
  knowledge:
    image: &knowledge-image ${KNOWLEDGE_IMAGE:?Set KNOWLEDGE_IMAGE to a release image or dev image}
    env_file: &knowledge-env
      - path: ${KNOWLEDGE_ENV_FILE:-.env}
        required: true
    environment:
      APP_ENV: prod
    ports:
      - "127.0.0.1:${KNOWLEDGE_PORT:-8080}:8080"
    init: true
    restart: unless-stopped
    volumes:
      - knowledge-artifacts:/artifacts

  worker:
    image: *knowledge-image
    env_file: *knowledge-env
    environment:
      APP_ENV: prod
    command: ["python", "-m", "elice_knowledge", "worker"]
    healthcheck:
      disable: true
    init: true
    restart: unless-stopped
    volumes:
      - knowledge-artifacts:/artifacts

volumes:
  knowledge-artifacts:
