name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release merge
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.release.outputs.matrix }}
      has_images: ${{ steps.release.outputs.has_images }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact merged PR, version and unused tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/release.py prepare

  images:
    name: Publish ${{ matrix.service }}
    needs: prepare
    if: needs.prepare.outputs.has_images == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            QA_BUILD_REVISION=${{ github.sha }}
            QA_BUILD_DIRTY=false
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ matrix.image }}:${{ needs.prepare.outputs.tag }}
            ${{ matrix.image }}:sha-${{ github.sha }}
            ${{ matrix.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.tag }}

  publish:
    name: Create GitHub Release
    needs: [prepare, images]
    if: >-
      always() && needs.prepare.result == 'success' &&
      (needs.images.result == 'success' || needs.images.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create tag and release at the triggering merge commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/release.py publish
