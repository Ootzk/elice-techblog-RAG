[project]
name = "elice-knowledge"
version = "0.3.0"
description = "Elice techblog Knowledge service"
requires-python = ">=3.12,<3.13"
dependencies = [
  "beautifulsoup4>=4.13,<5",
  "bm25s>=0.3.9,<0.4",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "kiwipiepy>=0.21,<0.23",
  "krippendorff>=0.8,<0.9",
  # Ragas 0.4.3 imports vertexai, removed from langchain-community 0.4.
  "langchain-community>=0.3.31,<0.4",
  "langgraph>=1.0,<2",
  "llama-index-core>=0.14.25,<0.15",
  "llama-index-storage-docstore-postgres>=0.6.0,<0.7",
  "llama-index-storage-kvstore-postgres>=0.4.3,<0.5",
  "llama-index-vector-stores-postgres>=0.8,<0.9",
  "markdownify>=1.2,<2",
  "mcp>=1.20,<3",
  "mlflow-skinny>=3.18,<4",
  "numpy>=2,<3",
  "pandas>=2.2,<4",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "ragas>=0.4,<0.5",
  "scikit-learn>=1.7,<2",
  "scipy>=1.16,<2",
  "sqlalchemy>=2,<3",
  "statsmodels>=0.14,<0.16",
  "tiktoken>=0.14,<1",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/elice_knowledge"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
