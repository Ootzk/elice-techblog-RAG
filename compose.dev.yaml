# Development override with a project-owned database on this Mac.
# Shared homeserver infrastructure is never started/stopped by this Compose project.
services:
  knowledge:
    build:
      context: .
      dockerfile: apps/knowledge/Dockerfile
    volumes:
      - ./${MODEL_CATALOG_FILE:-models.json}:/app/models.json:ro
    environment:
      APP_ENV: dev
      MODEL_CATALOG_FILE: /app/models.json
      EVALUATION_JUDGES_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
  worker:
    volumes:
      - ./${MODEL_CATALOG_FILE:-models.json}:/app/models.json:ro
    environment:
      APP_ENV: dev
      MODEL_CATALOG_FILE: /app/models.json
      EVALUATION_JUDGES_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: pgvector/pgvector:pg17
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    volumes:
      - knowledge-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  knowledge-postgres:
